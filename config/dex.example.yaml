issuer: http://opencortex-dex:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  grantTypes:
    - authorization_code
    - refresh_token
    - urn:ietf:params:oauth:grant-type:token-exchange
    - urn:ietf:params:oauth:grant-type:device_code
  skipApprovalScreen: true

staticClients:
  - id: opencortex-runtime
    name: OpenCortex Runtime
    redirectURIs:
      - http://localhost:8080/auth/callback
    secretEnv: OPENCORTEX_DEX_CLIENT_SECRET
  - id: opencortex-cli
    name: OpenCortex CLI
    public: true

enablePasswordDB: false
