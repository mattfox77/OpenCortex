receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: opencortex-runtime
          metrics_path: /metrics
          static_configs:
            - targets: [host.containers.internal:8080]

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: opencortex-jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [debug]
